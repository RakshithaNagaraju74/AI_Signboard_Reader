name: signboard_reader
description: AI Signboard Reader for visually impaired users - Complete Version
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # UI & State Management
  provider: ^6.1.1
  
  # Camera & Image
  camera: ^0.10.5
  image_picker: ^1.0.7
  image: ^3.3.0
  
  # Machine Learning - Compatible Versions
  flutter_litert: ^3.8.0

  google_mlkit_text_recognition: ^0.16.0
  
  # Text-to-Speech
  flutter_tts: ^4.2.5

  
  # Permissions & Storage
  permission_handler: ^13.0.1
  path_provider: ^2.1.6
  path: ^1.9.1
  
  # Additional Utilities
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/best.tflite
    - assets/models/labels.txt
    - assets/models/classes.json
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21