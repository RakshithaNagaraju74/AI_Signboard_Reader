name: signboard_reader
description: SightToSound - AI accessibility assistant that transforms visual information into spoken guidance
version: 2.6.0+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  camera: ^0.10.5
  image_picker: ^1.0.7
  image: ^3.3.0
  flutter_litert: 3.8.0
  google_mlkit_text_recognition: ^0.16.0
  tesseract_ocr: ^0.5.0
  flutter_tts: ^4.2.5
  speech_to_text: 7.3.0
  geolocator: ^14.0.2
  geocoding: 5.0.0
  shared_preferences: ^2.5.3
  permission_handler: ^13.0.1
  path_provider: ^2.1.6
  path: ^1.9.1
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/best.tflite
    - assets/models/labels.txt
    - assets/models/classes.json
    - assets/images/
    - assets/tessdata_config.json
    - assets/tessdata/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21

flutter_icons:
  android: true
  ios: false
  image_path: "assets/images/app_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"